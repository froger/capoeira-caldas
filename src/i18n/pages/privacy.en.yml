title: Privacy Policy
description: Privacy policy for Associação Capoeira Caldas — no analytics cookies and no marketing data sharing.
p1: Associação Capoeira Caldas does not record or store information about visits to this site (we do not use analytics cookies, tracking pixels, or browsing profiles).
p2: Email addresses and other details you send us (WhatsApp or email) are used only to reply to your request. We do not share them with third parties for marketing.
