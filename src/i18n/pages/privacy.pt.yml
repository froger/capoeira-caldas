title: Política de Privacidade
description: Política de privacidade da Associação Capoeira Caldas — sem cookies de análise nem partilha de dados para marketing.
p1: A Associação Capoeira Caldas não regista nem armazena informação sobre as visitas a este site (não utilizamos cookies de análise, pixels de seguimento nem perfis de navegação).
p2: Os endereços de email e outros dados que nos enviares (WhatsApp ou email) são usados apenas para responder ao teu pedido. Não os partilhamos com terceiros para marketing.
