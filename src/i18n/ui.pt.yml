    description: "Conheça a Associação Capoeira Caldas — Capoeira Angola em Caldas da Rainha e Gaeiras."
    subtitle: "Capoeira Angola em Caldas da Rainha e Gaeiras."
    group_alt: "Grupo Associação Capoeira Caldas"
    locations_title: "Onde treinar"
    location_caldas: "Caldas da Rainha"
    location_gaeiras: "Gaeiras"
    location_gaeiras_place: "Espaço O"
    pedrinha_title: "Treinel Pedrinha"
    pedrinha_body: "Treinel Pedrinha é da Suécia, viveu na Austrália e treina Capoeira desde criança com Mestre Marcelo. Em 2025 abriu o grupo de Capoeira em Caldas da Rainha. Ama acrobacias e é conhecida pela sua Capoeira."
    instructors_title: "A nossa roda"
    intro_p1: "A Associação Capoeira Caldas é uma associação sem fins lucrativos dedicada à promoção da capoeira, da cultura afro-brasileira e da educação através do movimento, da música e da tradição."
    intro_p2: "A nossa missão é preservar e divulgar a história e os valores da capoeira, proporcionando um ambiente acolhedor onde crianças, jovens e adultos possam aprender, evoluir e desenvolver-se. Acreditamos que a capoeira vai muito além da atividade física: é uma expressão cultural que promove o respeito, a disciplina, a inclusão, a amizade e o espírito de comunidade."
    intro_p3: "Ao longo do nosso percurso, temos desenvolvido aulas, workshops, apresentações e projetos culturais e educativos, aproximando pessoas de diferentes idades e origens. Trabalhamos para manter viva a riqueza da capoeira, honrando as suas raízes e transmitindo este património cultural às gerações presentes e futuras."
    intro_p4: "No Centro Cultural Capoeira Caldas, todos são bem-vindos. Juntos, construímos uma comunidade onde a cultura, o conhecimento e a união caminham lado a lado."
