    pedrinha_title: "Treinel Pedrinha"
    pedrinha_body: "Treinel Pedrinha is from Sweden, lived in Australia, and has trained Capoeira since childhood with Mestre Marcelo. In 2025 she opened the Capoeira group in Caldas da Rainha. She loves acrobatics and is known for her Capoeira."
    instructors_title: "Our roda"
    intro_p1: "Associação Capoeira Caldas is a non-profit association dedicated to promoting capoeira, Afro-Brazilian culture, and education through movement, music, and tradition."
    intro_p2: "Our mission is to preserve and share the history and values of capoeira, providing a welcoming environment where children, young people, and adults can learn, grow, and develop. We believe capoeira goes far beyond physical activity: it is a cultural expression that fosters respect, discipline, inclusion, friendship, and community spirit."
    intro_p3: "Along our journey, we have developed classes, workshops, performances, and cultural and educational projects, bringing together people of different ages and backgrounds. We work to keep the richness of capoeira alive, honouring its roots and passing this cultural heritage on to present and future generations."
    intro_p4: "At Centro Cultural Capoeira Caldas, everyone is welcome. Together, we build a community where culture, knowledge, and unity go hand in hand."
