    price: "Free"
    period: "first class"
    features:
      - "No commitment"
      - "Meet the roda and bateria"
      - "Level assessment"
    highlighted: true
    cta: "Book Now"
  - id: monthly
    name: "Monthly Plan"
    price: "€45"
    period: "per month"
    features:
      - "2 classes per week"
      - "Open roda access"
      - "Support materials"
