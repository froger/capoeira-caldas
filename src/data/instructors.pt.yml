instructors:
  - id: marcelo
    name: "Mestre Marcelo Angola"
    bio: "O Mestre Marcelo Angola fundou o grupo Angoleiros do Mar em 1999 na ilha de Itaparica, Bahia. Graças à dedicação e à paixão pela Capoeira, o Mestre hoje tem muitas escolas de capoeira no mundo todo e abriu as portas para muitos capoeiristas."
    bio_short: "Fundou Angoleiros do Mar em 1999."
    photo: "/images/mestre_marcelo.jpeg"
  - id: pedrinha
    name: "Treinel Pedrinha"
    bio: "Da Suécia, viveu na Austrália e treina desde criança com Mestre Marcelo. Em 2025 abriu o grupo em Caldas da Rainha. Ama acrobacias e é conhecida pela sua Capoeira."
    bio_short: "Abriu o grupo em Caldas em 2025. Ama acrobacias."
    photo: "/images/roda_pedrinha.jpg"
  - id: zumbi
    name: "Zumbi"
    bio: "Zumbi partilha a Capoeira Angola com energia e espírito de comunidade em Caldas e Gaeiras."
    bio_short: "Energia e comunidade na Capoeira Angola."
    photo: "/images/zumbi_portrait.jpg"
