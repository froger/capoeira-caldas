items:
  - question: "Preciso de experiência prévia para começar?"
    answer: "Não! Temos turmas para iniciantes de todas as idades. A aula experimental é gratuita e sem compromisso."
  - question: "O que devo trazer na primeira aula?"
    answer: "Roupa confortável, garrafa de água e disposição para jogar. Não precisa de equipamento especial."
  - question: "Qual a diferença entre Capoeira Angola e Regional?"
    answer: "Angola é mais lenta e ritualística; Regional é mais rápida e acrobática. Na nossa associação, ambas convivem na roda."
  - question: "Crianças pequenas podem participar?"
    answer: "Sim! O programa Kids é para crianças dos 5 aos 9 anos, com foco no jogo, música e movimento."
  - question: "Como funciona a mensalidade?"
    answer: "Oferecemos planos mensal, trimestral e anual. A primeira aula experimental é sempre gratuita."
