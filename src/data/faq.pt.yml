items:
  - question: "Preciso de experiência prévia para começar?"
    answer: "Não! Aceitamos todos os níveis, desde iniciantes até avançados. A primeira aula é gratuita e sem compromisso."
  - question: "O que devo trazer na primeira aula?"
    answer: "Roupa confortável, garrafa de água e disposição para jogar. Não precisa de equipamento especial."
  - question: "Onde são as aulas?"
    answer: "Em Caldas da Rainha (Sociedade Columbófila Caldense) à segunda e quinta, e em Gaeiras (Espaço O) à terça."
  - question: "Quanto custa?"
    answer: "A anuidade cobre o seguro e a renovação de material: 30€ por ano para crianças e 20€ por ano para adultos. As mensalidades estão detalhadas nas páginas de Aulas e dependem de quantas vezes por semana praticas. A primeira aula é gratuita."
  - question: "Como posso contactar?"
    answer: "Telefone +351 920 477 255, email capoeiraangola.pt@gmail.com, ou pelas redes Instagram e Facebook."
