instructors:
  - id: marcelo
    name: "Mestre Marcelo Angola"
    bio: "Mestre Marcelo Angola founded the group Angoleiros do Mar in 1999 on the island of Itaparica, Bahia. Thanks to his dedication and passion for Capoeira, the Mestre now has many Capoeira schools worldwide and has opened doors for many capoeiristas."
    bio_short: "Founded Angoleiros do Mar in 1999."
    photo: "/images/mestre_marcelo.jpeg"
  - id: pedrinha
    name: "Treinel Pedrinha"
    bio: "From Sweden, lived in Australia, and has trained since childhood with Mestre Marcelo. In 2025 she opened the group in Caldas da Rainha. She loves acrobatics and is known for her Capoeira."
    bio_short: "Opened the Caldas group in 2025. Loves acrobatics."
    photo: "/images/roda_pedrinha.jpg"
  - id: zumbi
    name: "Zumbi"
    bio: "Zumbi shares Capoeira Angola with energy and community spirit in Caldas and Gaeiras."
    bio_short: "Energy and community in Capoeira Angola."
    photo: "/images/zumbi_portrait.jpg"
