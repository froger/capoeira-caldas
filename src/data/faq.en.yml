items:
  - question: "Do I need prior experience to start?"
    answer: "No! We have beginner classes for all ages. The trial class is free with no commitment."
  - question: "What should I bring to the first class?"
    answer: "Comfortable clothes, a water bottle and willingness to play. No special equipment needed."
  - question: "What is the difference between Capoeira Angola and Regional?"
    answer: "Angola is slower and ritualistic; Regional is faster and acrobatic. In our association, both coexist in the roda."
  - question: "Can young children participate?"
    answer: "Yes! The Kids program is for children aged 5 to 9, focusing on play, music and movement."
  - question: "How does the monthly fee work?"
    answer: "We offer monthly, quarterly and annual plans. The first trial class is always free."
