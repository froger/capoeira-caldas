items:
  - question: "Do I need prior experience to start?"
    answer: "No! We welcome all levels, from beginners to advanced. The first class is free and with no commitment."
  - question: "What should I bring to the first class?"
    answer: "Comfortable clothes, a water bottle, and willingness to play. No special equipment needed."
  - question: "Where are the classes?"
    answer: "In Caldas da Rainha (Sociedade Columbófila Caldense) on Monday and Thursday, and in Gaeiras (Espaço O) on Tuesday."
  - question: "How much does it cost?"
    answer: "The annual fee covers insurance and renewing material: €30 per year for kids and €20 per year for adults. Monthly fees are detailed on the Classes pages and depend on how many times a week you practice. The first class is free."
  - question: "How can I get in touch?"
    answer: "Phone +351 920 477 255, email capoeiraangola.pt@gmail.com, or via Instagram and Facebook."
