name: Website

on:
  push:
    branches: [main, master]
  pull_request:
  # Rebuild weekly so past / upcoming event UI stays current on the static site.
  schedule:
    - cron: '0 6 * * 3' # Wednesday 06:00 UTC
  workflow_dispatch:
    inputs:
      site:
        description: "Canonical origin (no path), e.g. https://froger.github.io or https://www.example.org"
        required: false
        type: string
        default: ""
      base_path:
        description: "URL base path, e.g. /capoeira-caldas/ (project Pages) or / (custom domain / user site)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve SITE and BASE_PATH
        env:
          INPUT_SITE: ${{ github.event.inputs.site }}
          INPUT_BASE_PATH: ${{ github.event.inputs.base_path }}
          VAR_SITE: ${{ vars.SITE }}
          VAR_BASE_PATH: ${{ vars.BASE_PATH }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: ./scripts/resolve-site-env.sh >> "$GITHUB_ENV"

      - name: Build in Docker
        run: docker compose -f docker/docker-compose.yml run --rm build
        env:
          SITE: ${{ env.SITE }}
          BASE_PATH: ${{ env.BASE_PATH }}

      - name: Smoke test
        run: ./scripts/smoke.sh
        env:
          SITE: ${{ env.SITE }}
          BASE_PATH: ${{ env.BASE_PATH }}

      - uses: actions/upload-pages-artifact@v3
        if: (github.event_name == 'push' || github.event_name == 'schedule') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: (github.event_name == 'push' || github.event_name == 'schedule') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
