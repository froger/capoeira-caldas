name: Admin

on:
  push:
    paths:
      - 'apps/admin/**'
      - '.github/workflows/admin.yml'
  pull_request:
    paths:
      - 'apps/admin/**'
      - '.github/workflows/admin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: apps/admin/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test:coverage

  release:
    name: Build installers
    needs: test
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage deb
          - os: macos-latest
            args: --mac dmg
          - os: windows-latest
            args: --win nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/admin
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: apps/admin/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build
        env:
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.ADMIN_GITHUB_OAUTH_CLIENT_ID }}
      - name: Package
        run: yarn electron-builder ${{ matrix.args }} --publish never
      - name: Stage installers
        shell: bash
        run: |
          dest="$GITHUB_WORKSPACE/admin-installers"
          mkdir -p "$dest"
          find release -type f \( \
            -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' -o \
            -name '*.exe' -o -name '*.blockmap' -o -name '*.yml' -o -name '*.yaml' \
          \) -exec cp {} "$dest/" \;
          find "$dest" -type f -print
          test -n "$(find "$dest" -type f -print -quit)"
      - uses: actions/upload-artifact@v5
        with:
          name: admin-${{ matrix.os }}
          path: admin-installers
          if-no-files-found: error

  publish:
    name: Attach installers to release
    needs: release
    if: github.ref_type == 'tag' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: admin-*
          path: installers
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/**/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
