name: Admin

on:
  push:
    paths:
      - 'apps/admin/**'
      - '.github/workflows/admin.yml'
  pull_request:
    paths:
      - 'apps/admin/**'
      - '.github/workflows/admin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: apps/admin/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test:coverage

  release:
    name: Build installers
    needs: test
    if: startsWith(github.ref, 'refs/tags/admin-v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage deb
          - os: macos-latest
            args: --mac dmg
          - os: windows-latest
            args: --win nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/admin
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: apps/admin/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build
        env:
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.ADMIN_GITHUB_OAUTH_CLIENT_ID }}
      - name: Package
        run: yarn electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: admin-${{ matrix.os }}
          path: |
            apps/admin/release/*.{AppImage,deb,dmg,exe,yml,yaml,blockmap}
            apps/admin/release/**/*.{AppImage,deb,dmg,exe}
          if-no-files-found: warn
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/admin-v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/admin/release/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
